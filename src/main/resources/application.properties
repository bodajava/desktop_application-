# =====================================================================
#  Exam Halls & Proctoring Allocation Management System
#  Bundled defaults. DO NOT commit real credentials here.
#  Override with (highest priority last):
#    1. ./config/application.properties  or  -Dapp.config=/path/to/file
#    2. Environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
#    3. JVM system properties: -Ddb.password=...
# =====================================================================

# ---------- Application ----------
app.name=Exam Halls & Proctoring
app.version=1.0.0

# ---------- Oracle connection ----------
# Service-name form (recommended):  jdbc:oracle:thin:@//host:port/SERVICE
# Oracle XE 21c / Free 23ai default PDB: XEPDB1 / FREEPDB1
db.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
db.username=EXAM_ADMIN
db.password=
db.driver=oracle.jdbc.OracleDriver

# ---------- HikariCP pool ----------
db.pool.name=ExamHallsPool
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.connectionTimeoutMs=5000
db.pool.idleTimeoutMs=600000
db.pool.maxLifetimeMs=1800000
db.pool.validationTimeoutMs=5000
# 0 = disabled; set e.g. 20000 during development to catch unclosed connections
db.pool.leakDetectionThresholdMs=0
db.pool.autoCommit=true
# 1 = one login attempt when the pool is created, fail fast, retry on next use
# (never -1: background retries with a wrong password can lock the Oracle account)
db.pool.initializationFailTimeoutMs=1

# ---------- Oracle driver tuning ----------
db.oracle.statementCacheSize=50
db.oracle.defaultRowPrefetch=50
db.oracle.connectTimeoutMs=4000

# ---------- Reports ----------
# Printed in every report header
app.school.name=Exam Control Office
# TrueType font with Arabic glyphs embedded in PDFs. Leave empty to auto-detect
# (Tahoma / Arial on Windows and macOS, DejaVu Sans / Noto on Linux).
reports.font.regular=
reports.font.bold=
# Default hourly rate pre-filled in the compensation workbook (editable in Excel)
reports.compensation.hourlyRate=50

# ---------- Security ----------
security.bcrypt.cost=12
# Consecutive failed sign-ins before a username is locked, and for how long
security.login.maxAttempts=5
security.login.lockMinutes=5
# Sign out automatically after this many minutes without keyboard/mouse activity (0 = never)
security.session.idleTimeoutMinutes=15
