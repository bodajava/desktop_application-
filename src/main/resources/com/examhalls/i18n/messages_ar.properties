error.TEACHER_NOT_ACTIVE=المعلم المختار مؤرشف ولا يمكن تكليفه.
error.NOT_FOUND=السجل المطلوب لم يعد موجودًا. يرجى التحديث والمحاولة مرة أخرى.
error.INSUFFICIENT_CAPACITY=لا توجد مقاعد امتحان شاغرة كافية في القاعات المتاحة لهذه الفترة.
error.STUDENT_CLASH=بعض الطلاب لديهم امتحان آخر في نفس الوقت.
error.NO_STUDENTS=لا يوجد طلاب مسجلون في الصف الدراسي الخاص بهذا الامتحان.
