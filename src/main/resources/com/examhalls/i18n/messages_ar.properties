error.EXPORT_FAILED=تعذر إنشاء الملف. تأكد أنه غير مفتوح في برنامج آخر ثم حاول مرة أخرى.
error.CANNOT_DELETE_SELF=لا يمكنك حذف حسابك الخاص.
error.LAST_ADMIN=يجب أن يبقى حساب واحد نشط على الأقل بدور مدير المدرسة.
error.TEACHER_LINK_REQUIRED=يجب ربط حساب المعلم بسجل معلم.
error.EXAM_HAS_SEATING=لهذا الامتحان خطة جلوس بالفعل. امسح الجلوس (والملاحظين) قبل تغيير التاريخ أو الفترة أو المادة.
