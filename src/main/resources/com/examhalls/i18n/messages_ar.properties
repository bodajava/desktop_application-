error.TEACHER_INELIGIBLE=لا يمكن تكليف المعلم المختار بملاحظة هذه القاعة.
error.INVALID_STATE=هذا الإجراء غير مسموح به في الحالة الحالية للامتحان.
error.INVALID_ARGUMENT=بعض القيم المدخلة غير صالحة.

# ---------- أخطاء Oracle القياسية ----------
error.DUPLICATE_VALUE=يوجد سجل آخر بنفس القيمة الفريدة.
error.RECORD_LOCKED=يقوم مستخدم آخر بتعديل هذه البيانات حاليًا. يرجى المحاولة بعد قليل.
error.NOT_NULL_VIOLATION=يوجد حقل إلزامي فارغ.
error.CHECK_VIOLATION=إحدى القيم خارج النطاق المسموح به.
error.PARENT_NOT_FOUND=السجل المرجعي (مثل القسم أو المادة أو القاعة) غير موجود.
error.CHILD_RECORDS_EXIST=هذا السجل مرتبط ببيانات أخرى ولا يمكن حذفه.
error.VALUE_TOO_LARGE=إحدى القيم أطول من المسموح.

# ---------- التطبيق ----------
error.DATABASE_UNAVAILABLE=تعذر الاتصال بقاعدة البيانات. تحقق من الشبكة وحاول مرة أخرى.
error.DATABASE_LOGIN_FAILED=رفضت قاعدة البيانات الحساب المُعد (اسم مستخدم أو كلمة مرور خاطئة، أو الحساب مقفل أو منتهي). اطلب من المسؤول مراجعة ملف config/application.properties.
error.INVALID_CREDENTIALS=اسم المستخدم أو كلمة المرور غير صحيحة.
error.ACCOUNT_LOCKED=محاولات فاشلة كثيرة. حاول مرة أخرى بعد {0} دقيقة.
error.ACCESS_DENIED=ليس لديك صلاحية لتنفيذ هذا الإجراء.
error.NOT_AUTHENTICATED=انتهت جلستك. يرجى تسجيل الدخول مرة أخرى.
error.WEAK_PASSWORD=يجب أن تكون كلمة المرور من 8 إلى 64 حرفًا وأن تحتوي على حروف وأرقام.
error.VALIDATION_FAILED=يرجى تصحيح الحقول المحددة: {0}
